spring.application.name=support
spring.datasource.url = jdbc:mysql://localhost:3306/workforceSupport
spring.datasource.username={{username}}
spring.datasource.password={{password}}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
app.allowed.email.domain ={{allowedDomain}}
logging.level.com.workplace.support = INFO
logging.file.name=logs/support.log
logging.logback.rollingpolicy.max-history = 7
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.log
jwt.secret.key ={{secretKey}}
jwt.expiration=86400000
